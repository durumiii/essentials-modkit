<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>modkit — Essentials 팬게임 모드 관리자</title>
<style>
 :root{--bg:#16171b;--panel:#1e2026;--card:#23252c;--line:#32343d;--tx:#e6e7ea;--sub:#9a9ca6;
   --acc:#5b8def;--acc2:#3d68c4;--ok:#4cc38a;--warn:#e5a54b;--err:#e5644b}
 *{box-sizing:border-box}
 body{font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;margin:0;background:var(--bg);
   color:var(--tx);min-height:100vh}
 header{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 28px;
   font-weight:700;font-size:17px;letter-spacing:.3px}
 header b{color:var(--acc)}
 main{max-width:720px;margin:0 auto;padding:28px}
 .screen{display:none}
 .screen.active{display:block}
 .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
   margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
 h2{margin:0 0 14px;font-size:16px}
 p.sub{color:var(--sub);font-size:13.5px;margin:0 0 16px}
 button{font-family:inherit;font-size:14.5px;color:var(--tx);background:var(--card);
   border:1px solid var(--line);border-radius:10px;padding:11px 18px;cursor:pointer}
 button:hover{background:#2c2e37}
 button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
 button.primary:hover{background:var(--acc2)}
 button.danger{border-color:var(--err);color:var(--err)}
 button.big{width:100%;padding:16px;font-size:15.5px;margin-bottom:10px}
 button:disabled{opacity:.5;cursor:default}
 .row{display:flex;gap:10px;flex-wrap:wrap}
 .light{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:700;
   padding:14px 18px;border-radius:12px;margin-bottom:16px}
 .light.ok{background:rgba(76,195,138,.14);color:var(--ok)}
 .light.warn{background:rgba(229,165,75,.14);color:var(--warn)}
 .light.err{background:rgba(229,100,75,.14);color:var(--err)}
 .dot{width:12px;height:12px;border-radius:50%;background:currentColor}
 .foreign-list{max-height:160px;overflow:auto;font-size:13px;color:var(--sub);
   background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px}
 .banner{background:rgba(229,165,75,.14);border:1px solid rgba(229,165,75,.35);color:var(--warn);
   border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
 .banner.note{background:var(--card);border-color:var(--line);color:var(--sub)}
 .drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;
   color:var(--sub);margin-bottom:16px}
 .drop.over{border-color:var(--acc);color:var(--acc)}
 #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);white-space:pre-line;
   border:1px solid var(--warn);color:var(--warn);padding:12px 20px;border-radius:10px;
   font-size:13.5px;display:none;max-width:80%;z-index:20}
 .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);
   border-radius:50%;display:inline-block;animation:spin .8s linear infinite;vertical-align:-2px}
 @keyframes spin{to{transform:rotate(360deg)}}
 .name{font-weight:600}
 .desc{color:var(--sub);font-size:12.5px}
</style></head>
<body>
<header><b>modkit</b> — Essentials 팬게임 모드 관리자</header>
<main>

<section id=s-folder class="screen active">
  <div class=panel>
    <h2>게임 폴더</h2>
    <p class=sub>게임이 설치된 폴더를 골라 주세요. (Game.ini와 Data 폴더가 있는 곳 — 모드 폴더가 아니에요.)</p>
    <button class="big primary" onclick="pickFolder()">폴더 선택</button>
    <div id=recent-list></div>
  </div>
</section>

<section id=s-diagnose class="screen">
  <div class=panel>
    <h2>폴더 진단</h2>
    <div id=diag-light></div>
    <div id=diag-banner></div>
    <div id=diag-foreign class=foreign-list style="display:none"></div>
    <div class=row>
      <button id=btn-quarantine class=primary onclick="quarantineAndContinue()">격리 후 계속</button>
      <button id=btn-skip onclick="skipDiagnose()">그냥 계속</button>
      <button onclick="showScreen('s-folder')">돌아가기</button>
    </div>
  </div>
</section>

<section id=s-mods class="screen">
  <div class=panel>
    <div id=mods-hero style="display:none;position:relative;border-radius:12px;overflow:hidden;margin-bottom:14px">
      <img id=mods-banner-img alt="" style="display:block;width:100%;height:170px;object-fit:cover;image-rendering:pixelated">
      <div id=mods-hero-name style="position:absolute;left:0;right:0;bottom:0;padding:26px 16px 10px;
        background:linear-gradient(transparent,rgba(0,0,0,.78));font-size:21px;font-weight:800;color:#fff"></div>
    </div>
    <p id=mods-game style="display:none;font-size:19px;font-weight:800;margin:0 0 14px"></p>
    <h2>모드 서랍</h2>
    <div id=mods-banner></div>
    <div class=drop id=dropzone>
      zip이나 모드 폴더를 여기로 끌어다 놓거나
      <button onclick="pickZip()">zip 선택</button>
      <button onclick="pickModFolder()">폴더 선택</button>
    </div>
    <div id=mods-list></div>
    <button onclick="showScreen('s-folder')">다른 게임 열기</button>
  </div>
</section>

</main>
<div id=toast></div>
<div id=edit style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30">
  <div style="max-width:460px;margin:18vh auto 0;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:22px">
    <h2>모드 정보 수정</h2>
    <p class=sub>이름표와 게임 소속이에요. 자동으로 채워진 값이라 다듬어도 돼요.</p>
    <p class=sub style="margin-bottom:4px">모드 이름</p>
    <input id=edit-name style="width:100%;margin-bottom:12px;padding:10px;border-radius:8px;
      border:1px solid var(--line);background:var(--card);color:var(--tx);font-family:inherit">
    <p class=sub style="margin-bottom:4px">게임 (Game.ini의 Title과 같아야 그 게임 서랍에 보여요)</p>
    <input id=edit-game style="width:100%;margin-bottom:16px;padding:10px;border-radius:8px;
      border:1px solid var(--line);background:var(--card);color:var(--tx);font-family:inherit">
    <div class=row>
      <button id=edit-save class=primary>저장</button>
      <button id=edit-cancel>취소</button>
    </div>
  </div>
</div>
<div id=ask style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30">
  <div style="max-width:520px;margin:18vh auto 0;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:22px">
    <h2 id=ask-title>설치 전에 알려 드려요</h2>
    <div id=ask-body class=foreign-list style="max-height:220px;white-space:pre-line"></div>
    <div class=row>
      <button id=ask-go class=primary>계속 설치</button>
      <button id=ask-no>취소</button>
    </div>
  </div>
</div>

<script>
let currentPath = "";

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.style.display = "none"; }, 4000);
}

function api() { return window.pywebview.api; }

window.addEventListener("pywebviewready", () => {
  loadRecent();
});

function loadRecent() {
  api().recent().then(r => {
    const box = document.getElementById("recent-list");
    box.innerHTML = "";
    if (!r.ok || !r.paths.length) return;
    const label = document.createElement("p");
    label.className = "sub";
    label.textContent = "최근 사용한 폴더";
    box.appendChild(label);
    r.paths.forEach(p => {
      const b = document.createElement("button");
      b.className = "big";
      b.textContent = p;
      b.onclick = () => openFolder(p);
      box.appendChild(b);
    });
  });
}

function pickFolder() {
  api().pick_folder().then(r => {
    if (r.ok) openFolder(r.path);
  });
}

let currentGame = null;   // game_status 결과 — 서랍 머리글에 게임 이름을 띄운다

function openFolder(path) {
  currentPath = path;
  api().remember(path).then(() => {
    api().game_status(path).then(status => {
      if (!status.ok) { toast("폴더를 읽지 못했어요 — " + status.error); return; }
      if (!status.looks_like_game) {
        toast("여기는 게임 폴더가 아닌 것 같아요 — Data 폴더나 Game.ini가 안 보여요.");
        return;
      }
      currentGame = status;
      if (status.has_manifest) {
        runDiagnose();      // 원본 대조는 정답지(동봉 manifest.json)가 있는 폴더에서만 가능하다
      } else {
        showModsScreen();   // 매니페스트 없는 폴더가 표준이다 — 안내할 것이 없다
      }
    });
  });
}

function runDiagnose() {
  showScreen("s-diagnose");
  const run = runDiagnose._run = (runDiagnose._run || 0) + 1;   // 늦게 온 결과 무시용
  const light = document.getElementById("diag-light");
  const foreignBox = document.getElementById("diag-foreign");
  foreignBox.style.display = "none";
  document.getElementById("diag-banner").innerHTML = "";
  // 진단이 끝나야 누를 수 있다 — 격리는 결과를 보고 결정하는 버튼이고,
  // 진단 중에 백엔드를 겹쳐 부르면 전수 스캔이 두 번 돈다.
  document.getElementById("btn-quarantine").disabled = true;
  document.getElementById("btn-skip").disabled = true;
  light.innerHTML = `<div class="light"><span class=spin></span>진단 중이에요… (파일이 많으면 몇 분 걸려요)</div>`;
  const stale = () => run !== runDiagnose._run
    || !document.getElementById("s-diagnose").classList.contains("active");
  api().diagnose(currentPath).then(d => {
    if (stale()) return;   // 그 사이 돌아갔거나 새 진단이 시작됐다 — 조용히 버린다
    document.getElementById("btn-skip").disabled = false;
    if (!d.ok) { showModsScreen("진단 실패 — " + d.error); return; }
    document.getElementById("btn-quarantine").disabled = !d.foreign.length;
    if (d.foreign.length) {
      light.innerHTML = `<div class="light warn"><span class=dot></span>원본에 없는 파일 ${d.foreign.length}개가 있어요</div>`;
      foreignBox.style.display = "block";
      foreignBox.textContent = d.foreign.join(", ");
    } else if (d.missing.length) {
      light.innerHTML = `<div class="light warn"><span class=dot></span>빠진 파일 ${d.missing.length}개가 있어요</div>`;
    } else {
      light.innerHTML = `<div class="light ok"><span class=dot></span>깨끗해요 — 손댄 흔적이 없어요</div>`;
    }
    const notes = [];
    if (d.known.length) notes.push(`아는 모드 변경 ${d.known.length}개예요.`);
    if (d.missing.length && d.foreign.length) notes.push(`빠진 파일 ${d.missing.length}개도 있어요.`);
    if (d.untracked) notes.push(
      `패치가 관리하지 않는 파일 ${d.untracked}개 — 게임 원본이나 세이브예요. 건드리지 않아요.`);
    document.getElementById("diag-banner").innerHTML = notes.length
      ? `<div class="banner note">${notes.join(" ")}</div>` : "";
  }).catch(err => { if (!stale()) showModsScreen("진단 실패 — " + err); });
}

function quarantineAndContinue() {
  // 격리도 백엔드에서 진단을 한 번 더 돌아 느리다 — 겹쳐 못 누르게 잠근다.
  document.getElementById("btn-quarantine").disabled = true;
  document.getElementById("btn-skip").disabled = true;
  document.getElementById("diag-light").innerHTML =
    `<div class="light"><span class=spin></span>격리 중이에요… (다시 확인하고 옮겨요)</div>`;
  api().quarantine_foreign(currentPath).then(r => {
    if (!r.ok) { toast("격리 실패 — " + r.error); runDiagnose(); return; }
    if (r.moved) toast(`원본에 없는 파일 ${r.moved}개를 _quarantine 폴더에 옮겨 뒀어요.`);
    showModsScreen();
  });
}

function skipDiagnose() { showModsScreen(); }

function showModsScreen(banner) {
  showScreen("s-mods");
  const hero = document.getElementById("mods-hero");
  const plain = document.getElementById("mods-game");
  if (currentGame && currentGame.banner) {
    document.getElementById("mods-banner-img").src = currentGame.banner;
    document.getElementById("mods-hero-name").textContent = currentGame.label;
    hero.style.display = "block";
    plain.style.display = "none";
  } else {
    hero.style.display = "none";
    plain.textContent = currentGame ? currentGame.label : "";
    plain.style.display = currentGame ? "block" : "none";
  }
  document.getElementById("mods-banner").innerHTML = banner
    ? `<div class=banner>${banner}</div>` : "";
  loadMods();
}

function loadMods() {
  api().mods(currentPath).then(r => {
    const box = document.getElementById("mods-list");
    box.innerHTML = "";
    if (!r.ok) { toast("모드 목록을 못 읽었어요 — " + r.error); return; }
    r.available.forEach(mod => {
      const card = document.createElement("div");
      card.className = "card";
      const info = document.createElement("div");
      info.innerHTML = `<div class=name>${mod.name}</div><div class=desc>${mod.description || ""}</div>`;
      const btn = document.createElement("button");
      if (mod.installed) {
        btn.textContent = "제거";
        btn.className = "danger";
        btn.onclick = () => removeMod(mod.name);
      } else {
        btn.textContent = "설치";
        btn.className = "primary";
        btn.onclick = () => applyMod(mod.name);
      }
      const editBtn = document.createElement("button");
      editBtn.textContent = "수정";
      editBtn.title = "이름·게임 소속 수정";
      editBtn.onclick = () => editMod(mod.name);
      card.appendChild(info);
      card.appendChild(editBtn);
      card.appendChild(btn);
      box.appendChild(card);
    });
  });
}

function bullets(lines) {
  // "본문 — 부연" 꼴은 부연을 들여쓴 하위 불릿으로 내린다.
  return lines.map(l => {
    const parts = l.split(" — ");
    return "\u2022 " + parts[0] + parts.slice(1).map(r => "\n\u00a0\u00a0\u00a0\u00a0\u2013 " + r).join("");
  }).join("\n");
}

function ask(lines) {
  // WebView가 confirm()을 그리는지에 기대지 않는다 — 자체 모달로 Promise<bool>.
  return new Promise(resolve => {
    const box = document.getElementById("ask");
    const tail = lines[lines.length - 1];
    document.getElementById("ask-body").textContent =
      bullets(lines.slice(0, -2)) + "\n\n" + tail;
    box.style.display = "block";
    const done = yes => { box.style.display = "none"; resolve(yes); };
    document.getElementById("ask-go").onclick = () => done(true);
    document.getElementById("ask-no").onclick = () => done(false);
  });
}

function editMod(name) {
  const box = document.getElementById("edit");
  document.getElementById("edit-name").value = name;
  document.getElementById("edit-game").value = (currentGame && currentGame.title) || "";
  box.style.display = "block";
  document.getElementById("edit-cancel").onclick = () => { box.style.display = "none"; };
  document.getElementById("edit-save").onclick = () => {
    const newName = document.getElementById("edit-name").value.trim();
    const newGame = document.getElementById("edit-game").value.trim();
    api().edit_mod(name, newName, newGame, currentPath || "").then(r => {
      box.style.display = "none";
      if (!r.ok) { toast("수정 실패 — " + r.error); return; }
      toast(`"${r.name}" (${r.game}) — 저장했어요.`);
      loadMods();
    });
  };
}

function applyMod(name) {
  api().preview_apply(currentPath, name).then(p => {
    if (!p.ok) { toast("확인 실패 — " + p.error); return; }
    if (p.blocked && p.blocked.length) {
      toast("설치할 수 없어요 — " + p.blocked.join(", "));
      return;
    }
    if (p.warnings && p.warnings.length) {
      ask([...p.warnings, "", "겹치는 자리는 나중에 설치한 쪽이 이겨요. 계속할까요?"])
        .then(go => { if (go) doApply(name); });
    } else {
      doApply(name);
    }
  });
}

function doApply(name) {
  api().apply_mod(currentPath, name).then(r => {
    if (!r.ok) {
      if (r.blocked) toast("설치할 수 없어요 — " + r.blocked.join(", "));
      else toast("설치 실패 — " + r.error);
      return;
    }
    toast(r.warnings && r.warnings.length
      ? `"${name}" 설치했어요\n` + bullets(r.warnings)
      : `"${name}" 설치했어요.`);
    loadMods();
  });
}

function removeMod(name) {
  api().remove_mod(currentPath, name).then(r => {
    if (!r.ok) { toast("제거 실패 — " + r.error); return; }
    toast(`"${name}" 제거했어요.`);
    loadMods();
  });
}

function importZip(path) {
  api().import_zip(path, currentPath || "").then(r => {
    if (!r.ok) { toast("zip 반입 실패 — " + r.error); return; }
    if (r.adopted) {
      toast(`"${r.name}" 모드로 만들어 서랍에 넣었어요. 이름과 설명은 나중에 다듬으면 돼요.`);
      (r.notes || []).forEach(n => toast(n));
    } else {
      toast(`"${r.name}" 모드를 서랍에 넣었어요.`);
    }
    loadMods();
  });
}

function importFolder(path) {
  api().import_folder(path, currentPath || "").then(r => {
    if (!r.ok) { toast("폴더 반입 실패 — " + r.error); return; }
    if (r.adopted) {
      toast(`"${r.name}" 모드로 만들어 서랍에 넣었어요. 이름과 설명은 나중에 다듬으면 돼요.`);
      (r.notes || []).forEach(n => toast(n));
    } else {
      toast(`"${r.name}" 모드를 서랍에 넣었어요.`);
    }
    loadMods();
  });
}

function pickZip() {
  api().pick_zip().then(r => {
    if (r.ok) importZip(r.path);
  });
}

function pickModFolder() {
  api().pick_folder().then(r => {
    if (r.ok) importFolder(r.path);
  });
}

// 실경로는 JS File 객체에는 없다 — 파이썬 쪽 DOM 핸들러(app._wire_drop)가 받아서
// 이 함수로 넘겨 준다. JS의 드롭 리스너는 하이라이트 표시만 맡는다.
window.handleDroppedPaths = dropped => {
  if (!currentPath) { toast("게임 폴더를 먼저 열어 주세요 — 어느 게임의 모드인지 알아야 해요."); return; }
  dropped.forEach(d => {
    if (d.isDir) importFolder(d.path);
    else if (d.path.toLowerCase().endsWith(".zip")) importZip(d.path);
    else toast(`${d.path} — zip이나 폴더만 반입돼요.`);
  });
};

const dropzone = document.getElementById("dropzone");
// 실제 드롭은 파이썬 쪽이 문서 전체에서 받는다 — 하이라이트도 문서 전체 드래그에 반응.
document.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) dropzone.classList.remove("over"); });
document.addEventListener("drop", e => { e.preventDefault(); dropzone.classList.remove("over"); });
</script>
</body></html>
